<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子名片 - 張立群 John｜寬憶行銷商務中心</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 色票對齊 shop.everan-sw.com/s/comspace1013 */
    :root {
      --bg: #FAF8F4;
      --band: #F3E6D6;
      --chip: #F4ECD7;
      --line: rgba(87,70,50,.16);
      --ac: #946A3C;
      --ac-d: #7A5530;
      --ink: #3B2411;
      --tx: #574632;
      --mu: #6C5F53;
      --foot: #3A2A1E;
      --foot-t: #EADFCE;
    }

    body {
      font-family: "Noto Sans TC", "PingFang TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 18px 44px;
    }

    .card {
      width: 100%;
      max-width: 350px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(87,70,50,0.12);
    }

    .brandbar {
      background: var(--band);
      padding: 20px 24px 16px;
      text-align: center;
    }
    .wordmark {
      font-size: 25px; font-weight: 700; letter-spacing: 0.24em;
      color: var(--ink); text-indent: 0.24em;
    }
    .brandbar .cn {
      margin-top: 7px;
      font-size: 12px; color: var(--mu); letter-spacing: 0.14em; text-indent: 0.14em;
    }

    .shot { width: 100%; display: block; }

    /* 姓名色帶 */
    .band {
      background: var(--foot);
      color: #fff;
      padding: 16px 20px 18px;
    }
    .band .name { font-size: 24px; font-weight: 700; letter-spacing: 0.08em; }
    .band .name em { font-style: normal; font-weight: 400; font-size: 19px; margin-left: 8px; color: var(--foot-t); }
    .band .role { margin-top: 6px; font-size: 12px; color: var(--foot-t); letter-spacing: 0.04em; opacity: .9; }

    .slogan {
      padding: 16px 20px 0;
      text-align: center;
      font-size: 15px; font-weight: 700; color: var(--ac-d); letter-spacing: 0.06em;
    }
    .slogan small {
      display: block; margin-top: 6px;
      font-size: 10px; font-weight: 400; color: var(--mu); letter-spacing: 0.1em;
    }

    .info { padding: 16px 20px 4px; }
    .info-row {
      display: flex; align-items: baseline; gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row b { color: var(--ac); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; min-width: 48px; }
    .info-row span { color: var(--ink); }

    .actions { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: 15px; font-weight: 600; letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
      transition: background .18s, border-color .18s;
    }
    .btn:hover { background: var(--chip); border-color: var(--ac); }
    .btn.soon {
      border-style: dashed;
      color: #A89A8C;
      background: transparent;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-primary {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff;
      font-size: 16px; font-weight: 700;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(148,106,60,0.22);
    }
    .btn-primary:hover { background: var(--ac-d); border-color: var(--ac-d); }
    .btn-primary:disabled {
      background: #E8E2D8; border-color: #E8E2D8; color: #A89A8C;
      box-shadow: none; cursor: not-allowed;
    }

    .status {
      max-width: 350px; width: 100%;
      margin-top: 12px;
      font-size: 13px; color: var(--mu); text-align: center; min-height: 20px;
    }
    .status.error { color: #A8432C; }
    .status.success { color: #2B7A6E; }

    .foot {
      margin-top: 20px;
      font-size: 10px; letter-spacing: 0.28em; color: #A89A8C; text-indent: 0.28em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brandbar">
      <div class="wordmark">COMSPACE</div>
      <div class="cn">寬憶行銷商務中心</div>
    </div>

    <img class="shot" src="img/hero-lounge.jpg" alt="寬憶行銷商務中心">

    <div class="band">
      <div class="name">張立群<em>John</em></div>
      <div class="role">寬憶行銷商務中心</div>
    </div>

    <div class="slogan">
      創業夢想　即刻啟航
      <small>COMSPACE, COME BUSINESS!</small>
    </div>

    <div class="info">
      <div class="info-row"><b>手機</b><span>0922-780-549</span></div>
      <div class="info-row"><b>LINE</b><span>0922780549（同手機）</span></div>
      <div class="info-row"><b>電話</b><span>03-302-0400</span></div>
      <div class="info-row"><b>信箱</b><span>service@comspace.com.tw</span></div>
      <div class="info-row"><b>藝文館</b><span>桃園市桃園區藝文一街 86-3 號 12 樓</span></div>
      <div class="info-row"><b>中路館</b><span>桃園市桃園區正光路 423-9 號 3 樓</span></div>
    </div>

    <div class="actions">
      <a class="btn" href="tel:0922780549"><span>立即致電</span>📞</a>
      <a class="btn" href="https://line.me/ti/p/~0922780549" target="_blank" rel="noopener"><span>立即加 LINE 聊</span>💬</a>
      <a class="btn" href="mailto:service@comspace.com.tw"><span>寄送 Email</span>✉️</a>
      <a class="btn" href="img/brand-video.mp4" target="_blank" rel="noopener"><span>觀看品牌影片</span>▶</a>
      <span class="btn soon">官方網站　即將上線</span>
      <button class="btn btn-primary" id="btnShare" disabled>載入中...</button>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="foot">COMSPACE BUSINESS CENTER</div>

  <script>
    // =============================================
    // 設定區：LIFF ID 建好後填這裡
    // =============================================
    const LIFF_ID = '2010175345-CivN9MHK';

    // Flex Message 的圖片／影片必須是 https 絕對網址
    const BASE = 'https://dennis821102.github.io/comspace-namecard';

    const LINKS = {
      tel:     'tel:0922780549',
      telShop: 'tel:0333020400',
      line:    'https://line.me/ti/p/~0922780549',
      mail:    'mailto:service@comspace.com.tw',
      video:   BASE + '/img/brand-video.mp4',
      mapArt:  'https://maps.google.com/?q=' + encodeURIComponent('桃園市藝文一街86-3號'),
      mapZhon: 'https://maps.google.com/?q=' + encodeURIComponent('桃園市正光路423-9號')
      // web: 官網待上線，屆時補網址並把 btnSoon 換成 btn
    };

    // 色票同 landing page
    const AC = '#946A3C';
    const INK = '#3B2411';
    const MU = '#6C5F53';
    const BG = '#FAF8F4';
    const BAND = '#F3E6D6';
    const FOOT = '#3A2A1E';
    const SEP = '#E3D7C6';

    function btn(label, uri, primary) {
      return {
        type: 'button',
        style: primary ? 'primary' : 'secondary',
        height: 'sm',
        color: primary ? AC : '#FFFFFF',
        action: { type: 'uri', label: label, uri: uri }
      };
    }

    // 佔位按鈕：外觀像按鈕但沒有 action（官網尚未提供網址）
    function btnSoon(label) {
      return {
        type: 'box',
        layout: 'vertical',
        cornerRadius: '6px',
        borderColor: '#DCCBB1',
        borderWidth: '1px',
        paddingAll: '11px',
        contents: [
          { type: 'text', text: label, size: 'sm', weight: 'bold', color: '#A89A8C', align: 'center' }
        ]
      };
    }

    // uri 有值時整列可點（地址列點了開導航）
    function infoRow(label, value, uri) {
      const row = {
        type: 'box',
        layout: 'baseline',
        spacing: 'sm',
        contents: [
          { type: 'text', text: label, size: 'xxs', color: AC, flex: 3, weight: 'bold' },
          { type: 'text', text: value, size: 'sm', color: INK, flex: 9, wrap: true }
        ]
      };
      if (uri) row.action = { type: 'uri', label: label, uri: uri };
      return row;
    }

    function bullet(text) {
      return {
        type: 'box',
        layout: 'baseline',
        spacing: 'sm',
        contents: [
          { type: 'text', text: '◆', size: 'xxs', color: AC, flex: 1 },
          { type: 'text', text: text, size: 'sm', color: '#574632', flex: 12, wrap: true }
        ]
      };
    }

    // ---------- 第一張：個人名片 ----------
    const bubbleProfile = {
      type: 'bubble',
      size: 'mega',
      styles: {
        header: { backgroundColor: BAND },
        body: { backgroundColor: BG },
        footer: { backgroundColor: BG }
      },
      header: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '16px',
        contents: [
          { type: 'text', text: 'C O M S P A C E', size: 'lg', weight: 'bold', color: INK, align: 'center' },
          { type: 'text', text: '寬憶行銷商務中心', size: 'xs', color: MU, align: 'center', margin: 'sm' }
        ]
      },
      hero: {
        type: 'image',
        url: BASE + '/img/hero-lounge.jpg',
        size: 'full',
        aspectRatio: '4:3',
        aspectMode: 'cover'
      },
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '20px',
        spacing: 'md',
        contents: [
          {
            type: 'box',
            layout: 'baseline',
            spacing: 'sm',
            contents: [
              { type: 'text', text: '張立群', size: 'xl', weight: 'bold', color: INK, flex: 0 },
              { type: 'text', text: 'John', size: 'md', color: AC, flex: 0 }
            ]
          },
          { type: 'text', text: '創業夢想　即刻啟航', size: 'xs', color: AC, margin: 'sm' },
          { type: 'separator', color: SEP, margin: 'lg' },
          {
            type: 'box',
            layout: 'vertical',
            margin: 'lg',
            spacing: 'sm',
            contents: [
              infoRow('手機', '0922-780-549'),
              infoRow('信箱', 'service@comspace.com.tw'),
              infoRow('藝文館', '藝文一街 86-3 號 12 樓', LINKS.mapArt),
              infoRow('中路館', '正光路 423-9 號 3 樓', LINKS.mapZhon),
              { type: 'text', text: '點地址可開啟導航', size: 'xxs', color: MU, align: 'end' }
            ]
          }
        ]
      },
      footer: {
        type: 'box',
        layout: 'vertical',
        spacing: 'sm',
        paddingAll: '16px',
        contents: [
          btn('立即致電', LINKS.tel, true),
          btn('立即加 LINE 聊', LINKS.line),
          btn('寄送 Email', LINKS.mail)
        ]
      }
    };

    // ---------- 第二張：服務項目（主視覺為品牌影片封面）----------
    const bubbleService = {
      type: 'bubble',
      size: 'mega',
      styles: {
        body: { backgroundColor: BG },
        footer: { backgroundColor: BG }
      },
      hero: {
        type: 'image',
        url: BASE + '/img/video-frame-cover.jpg',
        size: 'full',
        aspectRatio: '3:4',
        aspectMode: 'cover',
        action: { type: 'uri', label: '播放品牌影片', uri: LINKS.video }
      },
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '20px',
        spacing: 'sm',
        contents: [
          { type: 'text', text: '一站式辦公服務', size: 'lg', weight: 'bold', color: AC, align: 'center' },
          { type: 'text', text: '空間　登記　記帳　設立', size: 'xs', color: MU, align: 'center', margin: 'sm' },
          { type: 'separator', color: SEP, margin: 'lg' },
          {
            type: 'box',
            layout: 'vertical',
            margin: 'lg',
            spacing: 'sm',
            contents: [
              bullet('小型辦公室　2-5 人獨立空間'),
              bullet('商辦地址租賃　公司登記'),
              bullet('會議室租借　2-40 人'),
              bullet('會計記帳報稅　駐點會計師'),
              bullet('代辦公司設立登記')
            ]
          }
        ]
      },
      footer: {
        type: 'box',
        layout: 'vertical',
        spacing: 'sm',
        paddingAll: '16px',
        contents: [
          btn('觀看品牌影片', LINKS.video, true),
          btnSoon('官方網站　即將上線')
        ]
      }
    };

    // ---------- 第三張：方案與價格 ----------
    const bubblePlan = {
      type: 'bubble',
      size: 'mega',
      styles: {
        body: { backgroundColor: BG },
        footer: { backgroundColor: BG }
      },
      hero: {
        type: 'image',
        url: BASE + '/img/hero-meeting.jpg',
        size: 'full',
        aspectRatio: '20:13',
        aspectMode: 'cover'
      },
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '20px',
        spacing: 'sm',
        contents: [
          { type: 'text', text: '方案一覽', size: 'lg', weight: 'bold', color: INK, align: 'center' },
          { type: 'text', text: '以下未稅　實際依需求報價', size: 'xxs', color: MU, align: 'center', margin: 'sm' },
          { type: 'separator', color: SEP, margin: 'lg' },
          {
            type: 'box',
            layout: 'vertical',
            margin: 'lg',
            spacing: 'sm',
            contents: [
              infoRow('辦公室', 'NT$15,000 - 22,000 / 月'),
              infoRow('地址登記', 'NT$1,800 / 月'),
              infoRow('會議室', 'NT$1,000 起 / 小時'),
              infoRow('公司設立', 'NT$10,000 一次'),
              infoRow('記帳報稅', 'NT$2,500 / 月')
            ]
          }
        ]
      },
      footer: {
        type: 'box',
        layout: 'vertical',
        spacing: 'sm',
        paddingAll: '16px',
        contents: [
          btn('洽詢報價　03-302-0400', LINKS.telShop, true)
        ]
      }
    };

    const flexMessage = {
      type: 'flex',
      altText: '張立群 John｜寬憶行銷商務中心　電子名片',
      contents: {
        type: 'carousel',
        contents: [bubbleProfile, bubbleService, bubblePlan]
      }
    };
    // ---------- LIFF ----------
    const btnShare = document.getElementById('btnShare');
    const statusEl = document.getElementById('status');

    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function main() {
      try {
        if (!LIFF_ID || LIFF_ID.includes('YOUR_LIFF')) {
          setStatus('尚未設定 LIFF ID', 'error');
          btnShare.textContent = '尚未設定 LIFF ID';
          return;
        }

        setStatus('正在初始化 LIFF...');
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStatus('請先登入 LINE');
          liff.login();
          return;
        }

        if (!liff.isApiAvailable('shareTargetPicker')) {
          setStatus('此環境不支援分享功能，請在 LINE App 內開啟', 'error');
          btnShare.textContent = '請在 LINE 中開啟';
          return;
        }

        btnShare.disabled = false;
        btnShare.textContent = '分享我的電子名片';
        setStatus('');
      } catch (err) {
        setStatus('LIFF 初始化失敗: ' + err.message, 'error');
        btnShare.textContent = '初始化失敗';
      }
    }

    btnShare.addEventListener('click', async () => {
      try {
        btnShare.disabled = true;
        setStatus('開啟分享清單...');
        const result = await liff.shareTargetPicker([flexMessage]);
        if (result) {
          setStatus('名片已送出', 'success');
        } else {
          setStatus('已取消分享');
        }
      } catch (err) {
        setStatus('分享失敗: ' + err.message, 'error');
      } finally {
        btnShare.disabled = false;
        btnShare.textContent = '分享我的電子名片';
      }
    });

    main();
  </script>
</body>
</html>
