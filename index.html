<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子名片 - 張立群 John｜寬憶行銷商務中心</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 色票對齊 shop.everan-sw.com/s/comspace1013 */
    :root {
      --bg: #FAF8F4;
      --chip: #F4ECD7;
      --line: rgba(87,70,50,.14);
      --ac: #946A3C;
      --ac-d: #7A5530;
      --ink: #3B2411;
      --tx: #574632;
      --mu: #6C5F53;
    }

    body {
      font-family: "Noto Sans TC", "PingFang TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 18px 44px;
    }

    .card {
      width: 100%;
      max-width: 352px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(87,70,50,0.1);
    }

    .shot { width: 100%; display: block; }
    .pad { padding: 22px 24px; }

    .kicker {
      font-size: 10px; font-weight: 700; color: var(--ac);
      letter-spacing: 0.22em; text-indent: 0.22em;
    }

    .name {
      margin-top: 12px;
      font-size: 27px; font-weight: 700; color: var(--ink); letter-spacing: 0.04em;
    }
    .name em { font-style: normal; font-weight: 400; font-size: 17px; color: var(--mu); margin-left: 10px; }
    .sub { margin-top: 6px; font-size: 12px; color: var(--mu); letter-spacing: 0.06em; }

    hr.rule { border: none; border-top: 1px solid var(--line); margin: 18px 0; }

    .rows { display: flex; flex-direction: column; gap: 11px; }
    .row { display: flex; align-items: baseline; gap: 14px; font-size: 14px; }
    .row .k {
      flex: 0 0 56px;
      font-size: 11px; font-weight: 700; color: var(--ac); letter-spacing: 0.06em;
    }
    .row .v { flex: 1; color: var(--ink); }
    .row.link .v::after { content: ' ›'; color: var(--ac); }
    .row.link { cursor: pointer; }

    .group-label {
      margin-bottom: 10px;
      font-size: 10px; font-weight: 700; color: var(--mu); letter-spacing: 0.2em;
    }

    .actions { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 9px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 14.5px; font-weight: 600; letter-spacing: 0.04em;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background .18s, border-color .18s;
    }
    .btn:hover { background: var(--chip); border-color: var(--ac); }
    .btn.soon {
      border-style: dashed; color: #A89A8C; background: transparent;
      cursor: not-allowed; pointer-events: none;
    }
    .btn-primary {
      background: var(--ac); border-color: var(--ac); color: #fff;
      font-size: 15px; font-weight: 700; padding: 15px 16px;
    }
    .btn-primary:hover { background: var(--ac-d); border-color: var(--ac-d); }
    .btn-primary:disabled {
      background: #E8E2D8; border-color: #E8E2D8; color: #A89A8C; cursor: not-allowed;
    }

    .status {
      max-width: 352px; width: 100%;
      margin-top: 12px;
      font-size: 13px; color: var(--mu); text-align: center; min-height: 20px;
    }
    .status.error { color: #A8432C; }
    .status.success { color: #2B7A6E; }

    .foot {
      margin-top: 20px;
      font-size: 10px; letter-spacing: 0.26em; color: #A89A8C; text-indent: 0.26em;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="shot" src="img/hero-lounge.jpg" alt="寬憶行銷商務中心">

    <div class="pad">
      <div class="kicker">COMSPACE　寬憶行銷商務中心</div>
      <div class="name">張立群<em>John</em></div>
      <div class="sub">創業夢想　即刻啟航</div>

      <hr class="rule">

      <div class="rows">
        <div class="row"><span class="k">手機</span><span class="v">0922-780-549</span></div>
        <div class="row"><span class="k">信箱</span><span class="v">service@comspace.com.tw</span></div>
      </div>

      <hr class="rule">

      <div class="group-label">據點</div>
      <div class="rows">
        <div class="row link" onclick="location.href='https://maps.google.com/?q=' + encodeURIComponent('桃園市藝文一街86-3號')">
          <span class="k">藝文館</span><span class="v">藝文一街 86-3 號 12 樓</span>
        </div>
        <div class="row link" onclick="location.href='https://maps.google.com/?q=' + encodeURIComponent('桃園市正光路423-9號')">
          <span class="k">中路館</span><span class="v">正光路 423-9 號 3 樓</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="tel:0922780549">立即致電</a>
      <a class="btn" href="https://line.me/ti/p/~0922780549" target="_blank" rel="noopener">加入 LINE</a>
      <a class="btn" href="mailto:service@comspace.com.tw">寄送 Email</a>
      <a class="btn" href="img/brand-video.mp4" target="_blank" rel="noopener">觀看品牌影片</a>
      <span class="btn soon">官方網站　即將上線</span>
      <button class="btn btn-primary" id="btnShare" disabled>載入中...</button>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="foot">COMSPACE BUSINESS CENTER</div>

  <script>
    // =============================================
    // 設定區：LIFF ID
    // =============================================
    const LIFF_ID = '2010175345-CivN9MHK';

    // Flex Message 的圖片／影片必須是 https 絕對網址
    const BASE = 'https://dennis821102.github.io/comspace-namecard';

    const LINKS = {
      tel:     'tel:0922780549',
      telShop: 'tel:0333020400',
      line:    'https://line.me/ti/p/~0922780549',
      mail:    'mailto:service@comspace.com.tw',
      video:   BASE + '/img/brand-video.mp4',
      mapArt:  'https://maps.google.com/?q=' + encodeURIComponent('桃園市藝文一街86-3號'),
      mapZhon: 'https://maps.google.com/?q=' + encodeURIComponent('桃園市正光路423-9號')
      // web: 官網待上線，屆時補網址並把 btnSoon 換成 btn
    };

    const AC = '#946A3C';
    const INK = '#3B2411';
    const MU = '#6C5F53';
    const BG = '#FAF8F4';
    const SEP = '#E6DDD0';

    // ---- 共用排版元件：三張卡片共用同一套節奏 ----
    // kicker（小標籤）→ heading（主標）→ rule（細線）→ 兩欄列 → 按鈕

    function kicker(text) {
      return { type: 'text', text: text, size: 'xxs', weight: 'bold', color: AC };
    }

    function heading(text) {
      return { type: 'text', text: text, size: 'xl', weight: 'bold', color: INK, margin: 'md' };
    }

    function subline(text) {
      return { type: 'text', text: text, size: 'xs', color: MU, margin: 'sm', wrap: true };
    }

    function rule() {
      return { type: 'separator', color: SEP, margin: 'xl' };
    }

    // 兩欄列：左標籤、右內容；opt.uri 有值時整列可點
    function row(label, value, opt) {
      opt = opt || {};
      const right = {
        type: 'text',
        text: value,
        size: 'sm',
        color: opt.muted ? MU : INK,
        flex: 8,
        wrap: true
      };
      if (opt.align) right.align = opt.align;
      if (opt.bold) right.weight = 'bold';
      const box = {
        type: 'box',
        layout: 'baseline',
        spacing: 'md',
        contents: [
          { type: 'text', text: label, size: 'xxs', weight: 'bold', color: AC, flex: 4 },
          right
        ]
      };
      if (opt.uri) {
        box.action = { type: 'uri', label: label, uri: opt.uri };
        box.contents.push({ type: 'text', text: '›', size: 'sm', color: AC, flex: 0 });
      }
      return box;
    }

    function rowsBox(items) {
      return { type: 'box', layout: 'vertical', margin: 'lg', spacing: 'md', contents: items };
    }

    function btn(label, uri, primary) {
      return {
        type: 'button',
        style: primary ? 'primary' : 'secondary',
        height: 'sm',
        color: primary ? AC : '#FFFFFF',
        action: { type: 'uri', label: label, uri: uri }
      };
    }

    // 佔位按鈕：外觀像按鈕但沒有 action（官網尚未提供網址）
    function btnSoon(label) {
      return {
        type: 'box',
        layout: 'vertical',
        cornerRadius: '6px',
        borderColor: '#DCCBB1',
        borderWidth: '1px',
        paddingAll: '11px',
        contents: [
          { type: 'text', text: label, size: 'sm', weight: 'bold', color: '#A89A8C', align: 'center' }
        ]
      };
    }

    function footer(items) {
      return { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '18px', contents: items };
    }

    function hero(img) {
      return { type: 'image', url: BASE + img, size: 'full', aspectRatio: '4:3', aspectMode: 'cover' };
    }

    const SKIN = { body: { backgroundColor: BG }, footer: { backgroundColor: BG } };

    // ---------- 第一張：名片 ----------
    const bubbleProfile = {
      type: 'bubble',
      size: 'mega',
      styles: SKIN,
      hero: hero('/img/hero-lounge.jpg'),
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '22px',
        contents: [
          kicker('COMSPACE　寬憶行銷商務中心'),
          {
            type: 'box',
            layout: 'baseline',
            spacing: 'md',
            margin: 'md',
            contents: [
              { type: 'text', text: '張立群', size: 'xxl', weight: 'bold', color: INK, flex: 0 },
              { type: 'text', text: 'John', size: 'sm', color: MU, flex: 0 }
            ]
          },
          subline('創業夢想　即刻啟航'),
          rule(),
          rowsBox([
            row('手機', '0922-780-549'),
            row('信箱', 'service@comspace.com.tw'),
            row('藝文館', '藝文一街 86-3 號 12 樓', { uri: LINKS.mapArt }),
            row('中路館', '正光路 423-9 號 3 樓', { uri: LINKS.mapZhon })
          ])
        ]
      },
      footer: footer([
        btn('立即致電', LINKS.tel, true),
        btn('加入 LINE', LINKS.line),
        btn('寄送 Email', LINKS.mail)
      ])
    };

    // ---------- 第二張：服務 ----------
    const bubbleService = {
      type: 'bubble',
      size: 'mega',
      styles: SKIN,
      hero: Object.assign(hero('/img/video-frame-cover.jpg'), {
        action: { type: 'uri', label: '播放品牌影片', uri: LINKS.video }
      }),
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '22px',
        contents: [
          kicker('S E R V I C E S'),
          heading('一站式辦公服務'),
          subline('空間　登記　記帳　設立'),
          rule(),
          rowsBox([
            row('辦公室', '2-5 人獨立空間', { muted: true }),
            row('地址登記', '公司營業登記', { muted: true }),
            row('會議室', '2-40 人場地', { muted: true }),
            row('會計', '記帳報稅　駐點會計師', { muted: true }),
            row('設立', '代辦公司設立登記', { muted: true })
          ])
        ]
      },
      footer: footer([
        btn('觀看品牌影片', LINKS.video, true),
        btnSoon('官方網站　即將上線')
      ])
    };

    // ---------- 第三張：方案 ----------
    const bubblePlan = {
      type: 'bubble',
      size: 'mega',
      styles: SKIN,
      hero: hero('/img/hero-meeting.jpg'),
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '22px',
        contents: [
          kicker('P R I C I N G'),
          heading('方案一覽'),
          subline('以下未稅　實際依需求報價'),
          rule(),
          rowsBox([
            row('辦公室', 'NT$15,000 起 / 月', { align: 'end', bold: true }),
            row('地址登記', 'NT$1,800 / 月', { align: 'end', bold: true }),
            row('會議室', 'NT$1,000 起 / 時', { align: 'end', bold: true }),
            row('公司設立', 'NT$10,000 一次', { align: 'end', bold: true }),
            row('記帳報稅', 'NT$2,500 / 月', { align: 'end', bold: true })
          ])
        ]
      },
      footer: footer([
        btn('洽詢報價　0922-780-549', LINKS.tel, true)
      ])
    };

    const flexMessage = {
      type: 'flex',
      altText: '張立群 John｜寬憶行銷商務中心　電子名片',
      contents: {
        type: 'carousel',
        contents: [bubbleProfile, bubbleService, bubblePlan]
      }
    };

    // ---------- LIFF ----------
    const btnShare = document.getElementById('btnShare');
    const statusEl = document.getElementById('status');

    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function main() {
      try {
        if (!LIFF_ID || LIFF_ID.includes('YOUR_LIFF')) {
          setStatus('尚未設定 LIFF ID', 'error');
          btnShare.textContent = '尚未設定 LIFF ID';
          return;
        }

        setStatus('正在初始化 LIFF...');
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStatus('請先登入 LINE');
          liff.login();
          return;
        }

        if (!liff.isApiAvailable('shareTargetPicker')) {
          setStatus('此環境不支援分享功能，請在 LINE App 內開啟', 'error');
          btnShare.textContent = '請在 LINE 中開啟';
          return;
        }

        btnShare.disabled = false;
        btnShare.textContent = '分享我的電子名片';
        setStatus('');
      } catch (err) {
        setStatus('LIFF 初始化失敗: ' + err.message, 'error');
        btnShare.textContent = '初始化失敗';
      }
    }

    btnShare.addEventListener('click', async () => {
      try {
        btnShare.disabled = true;
        setStatus('開啟分享清單...');
        const result = await liff.shareTargetPicker([flexMessage]);
        if (result) {
          setStatus('名片已送出', 'success');
        } else {
          setStatus('已取消分享');
        }
      } catch (err) {
        setStatus('分享失敗: ' + err.message, 'error');
      } finally {
        btnShare.disabled = false;
        btnShare.textContent = '分享我的電子名片';
      }
    });

    main();
  </script>
</body>
</html>
